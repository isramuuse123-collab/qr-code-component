<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | QR code component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      @import url("https://fonts.google.com/specimen/Outfit");
      body {
        background-color: hsl(212, 45%, 89%);

        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 100px;
        align-items: center;
        margin: 0;
        min-height: 100vh;
        font-weight: 400;
        font-family: "Outfit", sans-serif;
      }

      .asra {
        text-align: center;
        padding-top: 0;
        border-radius: 12px;
        width: 1440px;
        max-width: 260px;
        background-color: hsl(0, 0%, 100%);
      }
      .card {
        background-color: white;

        padding: 16px;

        background-size: 10px;
        border-radius: 20px; /* Changed from 50px to 20px */
        overflow: hidden;
      }
      .image {
        width: 100%;
        border-radius: 15px;
        height: auto;
        margin: 0;
      }
      h3 {
        font-size: 20px;
        margin-top: 16px;
        margin-bottom: 12px;
        color: hsl(218, 44%, 22%);
      }

      p {
        font-size: 15px;
        color: hsl(216, 15%, 48%);
        margin-bottom: 16px;
      }
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="asra">
      <div class="card">
        <img
          class="image"
          src="images\image-qr-code.png"
          alt=" QR code image"
        />

        <h3>Improve your front-end skills by building projects</h3>
        <p>
          Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level
        </p>
      </div>
    </div>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">isra muuse</a>.
    </footer>
  </body>
</html>
