<!doctype html>
<html lang="en">
  <head>
    <!-- Google Fonts: Figtree -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      @import url(https://fonts.google.com/specimen/Figtree);
      body {
        background-color: hsl(47, 88%, 63%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: "Figtree", sans-serif;
      }
      .font {
        font-weight: 500, 800;
        font-size: 16px;
      }
      .img {
        display: block;
        margin-bottom: 24px;
      }
      .box {
        padding: 12px;
        align-items: center;
        max-width: 340px;
        background-color: hsl(0, 0%, 100%);
        border-radius: 12px;
        border: 1px solid #111111;
        box-shadow: 8px 8px 0px #000000;
      }
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
        margin-top: 20px;
      }
      #p1 {
        color: hsl(0, 0%, 42%);
      }
      #p2 {
        color: hsl(0, 0%, 7%);
      }
      #greg {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        margin-top: 24px;
      }
      .img2 {
        width: 32px;
        height: 32px;
        border-radius: 50%;
      }
      .img {
        border-radius: 12px;
      }
      #str {
        border-radius: 4px;
        border: none;
        background-color: hsl(47, 88%, 63%);
        padding: 6px 12px;
        margin-top: 24px;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img class="img" src="assets\images\illustration-article.svg" />
      <strong class="fonts" id="str">Learning</strong>

      <p class="fonts" id="p2">Published 21 Dec 2023</p>

      <h2 class="fonts">HTML & CSS foundations</h2>

      <p class="fonts" id="p1">
        These languages are the backbone of every website, defining structure,
        content, and presentation.
      </p>

      <strong class="fonts" id="greg">
        <img class="img2" src="assets\images\image-avatar.webp" />Greg
        Hooper</strong
      >
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">isra muusw</a>.
    </footer>
  </body>
</html>
